<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kabari Gang</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #332f2c;
        color: #f2ece2;
        font-family: "Space Grotesk", system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #c2703f;
        color: #332f2c;
        font-weight: 700;
        font-size: 22px;
        font-family: ui-monospace, monospace;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #b9b1a5;
        font-size: 14px;
        max-width: 320px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #c2703f;
        color: #332f2c;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">KG</div>
      <h1>You're offline</h1>
      <p>Kabari Gang needs an internet connection to load your pickups. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
