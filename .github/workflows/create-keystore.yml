name: Create Signing Keystore (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate keystore
        env:
          KG_KEYSTORE_PASSWORD: ${{ secrets.KG_KEYSTORE_PASSWORD }}
          KG_KEY_ALIAS: ${{ secrets.KG_KEY_ALIAS }}
          KG_KEY_PASSWORD: ${{ secrets.KG_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore kabarigang.keystore \
            -alias "$KG_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KG_KEYSTORE_PASSWORD" \
            -keypass "$KG_KEY_PASSWORD" \
            -dname "CN=Kabari Gang, OU=Mobile, O=Kabari Gang, L=Islamabad, C=PK"

      - name: Encode keystore to base64
        run: base64 -w 0 kabarigang.keystore > keystore-base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v6
        with:
          name: kabari-gang-keystore
          path: |
            kabarigang.keystore
            keystore-base64.txt
          if-no-files-found: error
